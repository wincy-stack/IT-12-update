services:
  - type: web
    name: it-12-system
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_STAFF_PASSWORD
        generateValue: true
